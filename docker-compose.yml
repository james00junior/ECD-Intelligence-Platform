services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterprise_agent_postgres

    environment:
      POSTGRES_DB: enterprise_analytics
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: agent_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
